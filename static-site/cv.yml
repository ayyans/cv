# =============================================================================
# CV — multi-language data for portfolio i18n
# -----------------------------------------------------------------------------
# Single source of truth for the resume content in every locale the portfolio
# supports. Each entry under `locales.<lang>` is a complete translation — no
# inheritance between locales, so you can reorder or rewrite any locale
# independently.
#
# To add a new locale:
#   1. Copy the `en` block, translate every value, save under a new locale code
#      (e.g. `ar`, `de`, `es`).
#   2. Register the locale in any front-end locale switcher / Next.js i18n
#      routing / Go loader.
#
# To consume this file:
#   - Next.js: import yaml and pick `locales[router.locale]` (with `js-yaml`)
#   - Go: load at startup with gopkg.in/yaml.v3, expose via /api/cv?lang=...
#   - Static generator: read both blocks, emit one HTML per locale
#
# Date format: `start`/`end` use ISO YYYY-MM for sortable ordering.
# `end: null` means "current / ongoing".
# =============================================================================

defaultLocale: en
supportedLocales: [en, fr]

