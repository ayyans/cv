---
# yeddes.com — portfolio
# All objects are namespace-scoped to `yeddes`.
# Public hostname is the apex (yeddes.com), so we use the `https-yeddes`
# section of the shared gateway, not the wildcard.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: yeddes-com
  namespace: yeddes
  labels:
    app: yeddes-com
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yeddes-com
  template:
    metadata:
      labels:
        app: yeddes-com
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: app
          image: ghcr.io/ayyans/cv:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_SITE_URL
              value: https://yeddes.com
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yeddes-com
  namespace: yeddes
  labels:
    app: yeddes-com
spec:
  type: ClusterIP
  selector:
    app: yeddes-com
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yeddes-com
  namespace: yeddes
  labels:
    app: yeddes-com
spec:
  parentRefs:
    - name: softdigitaledge
      namespace: softdigitaledge
      sectionName: https-yeddes
  hostnames:
    - yeddes.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yeddes-com
          port: 80
