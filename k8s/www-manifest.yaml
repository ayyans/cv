---
# www.yeddes.com -> yeddes.com (301, both HTTPS, preserves path + query).
# Uses the wildcard HTTP section. No Service backend — pure redirect.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yeddes-com-www
  namespace: yeddes
  labels:
    app: yeddes-com
spec:
  parentRefs:
    - name: softdigitaledge
      namespace: softdigitaledge
      sectionName: https-yeddes-wildcard
  hostnames:
    - www.yeddes.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: yeddes.com
            statusCode: 301
